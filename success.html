<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success Stories - LPU Lost & Found</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fafafa;color:#111}
:root{--orange:#E55E00;--border:#e9e9e9}
nav{display:flex;align-items:center;justify-content:space-between;padding:12px 4%;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;gap:12px}
.nav-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo-img{width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid #eee}
.brand h1{color:var(--orange);font-size:15px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:9px;color:#888;letter-spacing:1.5px;font-weight:700;margin-top:2px}
.btn{padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;display:inline-block;border:none;cursor:pointer}
.btn-ghost{background:#fff;border:1px solid var(--border);color:#111}
.container{max-width:900px;margin:32px auto;padding:0 4%}
.header{text-align:center;margin-bottom:32px}
.header h2{font-size:36px;font-weight:800;letter-spacing:-1px}
.header h2 span{color:var(--orange)}
.header p{color:#777;margin-top:10px;font-size:14px}
.timeline{display:flex;flex-direction:column;gap:14px}
.success-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:0.2s}
.success-card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.06)}
.icon{width:44px;height:44px;background:#e6ffe6;border:1px solid #c6f6c6;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#0a7a0a;flex-shrink:0}
.success-card h4{font-size:14px;font-weight:700;line-height:1.3}
.success-card p{font-size:11px;color:#777;margin-top:4px}
.time{margin-left:auto;font-size:10px;color:#666;background:#f5f5f5;border:1px solid #eee;padding:6px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.empty{background:#fff;border:1px dashed #ccc;border-radius:20px;padding:50px 20px;text-align:center}
.empty p{color:#888;font-size:13px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:560px;padding:22px;max-height:92vh;overflow-y:auto}
.modal-box h3{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-box .sub{font-size:12px;color:#888;margin-bottom:14px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.modal-grid div{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px}
.modal-grid div span{font-size:10px;color:#888;font-weight:700;display:block;margin-bottom:3px;letter-spacing:0.5px}
.modal-grid div b{font-size:13px;word-break:break-word}
.modal-grid .full{grid-column:1/-1}
.modal-box img{width:100%;border-radius:12px;margin-top:10px;max-height:300px;object-fit:contain;background:#f6f6f6;padding:8px}
@media(max-width:768px){
  nav{padding:10px 3%}
  .logo-img{width:36px;height:36px}
  .brand h1{font-size:13px}
  .container{margin:20px auto;padding:0 3.5%}
  .header h2{font-size:26px}
  .success-card{padding:14px;border-radius:16px;flex-direction:column;align-items:flex-start}
  .time{margin-left:0}
  .modal-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav>
<div class="nav-left">
<img class="logo-img" src="https://upload.wikimedia.org/wikipedia/en/3/3a/Lovely_Professional_University_logo.png">
<div class="brand"><h1>Lovely Professional University</h1><p>LOST & FOUND PORTAL</p></div>
</div>
<a href="index.html" class="btn btn-ghost">Back to Home</a>
</nav>

<div class="container">
<div class="header">
<h2>Success <span>Stories</span></h2>
<p>Items that have been successfully reunited with their owners</p>
</div>

<div id="list" class="timeline"></div>
<div id="empty" class="empty"><p>Loading...</p></div>
</div>

<div class="modal" id="detailModal">
<div class="modal-box">
<h3 id="mTitle"></h3>
<p class="sub" id="mSub"></p>
<div class="modal-grid">
<div><span>TYPE</span><b id="mType"></b></div>
<div><span>CATEGORY</span><b id="mCat"></b></div>
<div><span>LOCATION</span><b id="mLoc"></b></div>
<div><span>DATE</span><b id="mDate"></b></div>
<div><span>POSTED BY</span><b id="mBy"></b></div>
<div><span>CONTACT</span><b id="mContact"></b></div>
<div><span>RESOLVED DATE</span><b id="mResDate"></b></div>
<div><span>SECRET KEY</span><b id="mKey"></b></div>
<div class="full"><span>DESCRIPTION</span><b id="mDesc"></b></div>
</div>
<img id="mPhoto" style="display:none">
<button class="btn" style="width:100%;margin-top:14px;background:#111;color:#fff;padding:12px;border-radius:12px" onclick="closeModal()">Close</button>
</div>
</div>

<!-- FIREBASE API ADDED -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCVhdBBzUBMH7E2qjEhqgTXkD_bigkcTjs",
  authDomain: "campus-find-67d1d.firebaseapp.com",
  projectId: "campus-find-67d1d",
  storageBucket: "campus-find-67d1d.firebasestorage.app",
  messagingSenderId: "612919517562",
  appId: "1:612919517562:web:df574fbe1d5155f245f6c3",
  measurementId: "G-V5SE01FERV"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let resolved = [];
const list = document.getElementById('list');
const empty = document.getElementById('empty');
function esc(s){return String(s||'').replace(/</g,'&lt;')}

function openDetail(docId){
  let it = resolved.find(x=>x.docId===docId);
  if(!it) return;
  document.getElementById('mTitle').innerText = it.name;
  document.getElementById('mSub').innerText = "Successfully returned to " + it.postedBy;
  document.getElementById('mType').innerText = String(it.type||'').toUpperCase();
  document.getElementById('mCat').innerText = it.cat;
  document.getElementById('mLoc').innerText = it.loc;
  document.getElementById('mDate').innerText = it.date;
  document.getElementById('mBy').innerText = it.postedBy;
  document.getElementById('mContact').innerText = it.contact;
  document.getElementById('mResDate').innerText = it.resolvedDate || it.date;
  document.getElementById('mKey').innerText = it.secretKey || '-';
  document.getElementById('mDesc').innerText = it.desc;
  let photo = document.getElementById('mPhoto');
  if(it.photo){ photo.src = it.photo; photo.style.display='block'; } else { photo.style.display='none'; }
  document.getElementById('detailModal').classList.add('active');
}
function closeModal(){ document.getElementById('detailModal').classList.remove('active'); }

async function loadResolved(){
  try{
    // 1. resolved collection se
    const rSnap = await db.collection('resolved').orderBy('createdAt','desc').get().catch(()=>({docs:[]}));
    let fromResolved = rSnap.docs.map(d=>({docId:d.id, ...d.data()}));
    // 2. items me jinka status == resolved hai
    const iSnap = await db.collection('items').where('status','==','resolved').get().catch(()=>({docs:[]}));
    let fromItems = iSnap.docs.map(d=>({docId:d.id, ...d.data()}));
    resolved = [...fromResolved, ...fromItems];
    // 3. Backup - purana localStorage
    if(resolved.length===0){
      resolved = JSON.parse(localStorage.getItem('lpu_resolved') || '[]').map((x,i)=>({docId:String(x.id||i), ...x}));
    }
  }catch(e){ console.log(e); resolved = JSON.parse(localStorage.getItem('lpu_resolved') || '[]'); }

  if(resolved.length===0){
    empty.style.display='block';
    empty.innerHTML='<p>No items resolved yet. When someone marks an item as returned, it will appear here.</p>';
    list.innerHTML='';
  }else{
    empty.style.display='none';
    list.innerHTML = resolved.map(it=>`
      <div class="success-card" onclick="openDetail('${it.docId}')">
        <div style="display:flex;gap:12px;align-items:center;flex:1;min-width:0">
          <div class="icon">✓</div>
          <div style="min-width:0">
            <h4>${esc(it.name)} - Returned to ${esc(it.postedBy)}</h4>
            <p>${String(it.type||'').toUpperCase()} • ${esc(it.loc)} • ${esc(it.cat)}</p>
          </div>
        </div>
        <span class="time">Resolved on ${esc(it.resolvedDate || it.date)}</span>
      </div>
    `).join('');
  }
}
loadResolved();

document.getElementById('detailModal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});
</script>
</body>
</html>
